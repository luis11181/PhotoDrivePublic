name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/main/DotnetBackEnd/solution
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install media tools used by the metadata and thumbnail tests
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends imagemagick ffmpeg file
      - run: dotnet restore tests/MediaExplorer.Media.Tests/MediaExplorer.Media.Tests.csproj
      - run: dotnet test tests/MediaExplorer.Media.Tests/MediaExplorer.Media.Tests.csproj --no-restore --disable-build-servers --maxcpucount:1
      - run: dotnet build src/Hosts/CSSApps.Api/CSSApps.Api.csproj --no-restore --disable-build-servers --maxcpucount:1
      - run: ../../../../scripts/verify-fresh-migrations.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: photodrive:ci
