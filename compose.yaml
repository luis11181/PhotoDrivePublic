name: photodrive-personal

# Production on Linux. The shared runtime and paths are also used on Windows.
services:
  photodrive:
    extends:
      file: compose.runtime.yaml
      service: photodrive
    restart: always
    environment:
      ReverseProxy__KnownNetworks__0: 172.31.250.0/28
      AccessControl__IpAllowlist__AllowedNetworks__5: 172.31.250.0/28
    networks: [photodrive]

networks:
  photodrive:
    ipam:
      config:
        - subnet: 172.31.250.0/28
